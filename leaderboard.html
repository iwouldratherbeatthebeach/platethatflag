<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard · Flag That Plate</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #0f172a;
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(56,189,248,0.14), transparent 35%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      min-height: 100vh;
    }
    .wrap {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 10px;
    }
    .nav a {
      color: var(--accent);
      text-decoration: none;
    }
    .hero {
      text-align: center;
      margin-bottom: 18px;
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 4.5vw, 3.4rem);
    }
    .hero p {
      color: var(--muted);
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }
    li:last-child { border-bottom: 0; }
    strong { color: var(--text); }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/leaderboard.html">Leaderboard</a>
    </div>

    <div class="hero">
      <h1>Leaderboard</h1>
      <p>See the most searched countries, most observed vehicle types, and top contributors.</p>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Top Countries</h2>
        <ul id="top-countries"><li><span>Loading...</span></li></ul>
      </div>

      <div class="card">
        <h2>Most Common Vehicle Types</h2>
        <ul id="top-vehicles"><li><span>Loading...</span></li></ul>
      </div>

      <div class="card">
        <h2>Top Submitters</h2>
        <ul id="top-submitters"><li><span>Loading...</span></li></ul>
      </div>
    </div>
  </div>

  <script>
    async function loadLeaderboard() {
      const res = await fetch("/leaderboard");
      const data = await res.json();

      const countriesEl = document.getElementById("top-countries");
      const vehiclesEl = document.getElementById("top-vehicles");
      const submittersEl = document.getElementById("top-submitters");

      countriesEl.innerHTML = (data.topCountries || []).map(row => `
        <li><span>${row.country}</span><strong>${row.searches}</strong></li>
      `).join("") || `<li><span>No data yet.</span></li>`;

      vehiclesEl.innerHTML = (data.topVehicles || []).map(row => `
        <li><span>${row.vehicle_make} ${row.vehicle_model}</span><strong>${row.observations}</strong></li>
      `).join("") || `<li><span>No data yet.</span></li>`;

      submittersEl.innerHTML = (data.topSubmitters || []).map(row => `
        <li><span>${row.username}</span><strong>${row.submissions}</strong></li>
      `).join("") || `<li><span>No data yet.</span></li>`;
    }

    loadLeaderboard();
  </script>
</body>
</html>
