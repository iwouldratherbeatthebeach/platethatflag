# Search macros. If the site's HEC token writes to an index other than platethatflag, change
# ptf_index (Settings > Advanced search > Search macros) and every dashboard and alert follows.

[ptf_index]
definition = index="platethatflag"
iseval = 0
description = The index the site's HEC token writes to. Change it here if yours is different.

[ptf_events]
definition = `ptf_index` sourcetype="platethatflag:event"
iseval = 0
description = Every event the site sends.

# The parts of a plate, as the site reads a plate whose code it doesn't know. Matches
# functions/_lib/plate.js (the repository's tests hold the site's decoder and that file to the same
# answers), so events sent before the Functions added these fields group the same way.
#   DGK0001 -> code GK, role_letter D (Diplomat), serial 0001     1034CYD -> code CY, D after it (UN Diplomat)
[ptf_plate_parts]
definition = eval ptf_p=substr(upper(replace(coalesce(plate, ""), "[^A-Za-z0-9]", "")), 1, 32), \
  layout=case(match(ptf_p, "^[A-Z]+$"), "letters_only", match(ptf_p, "^[A-Z]+[0-9]+$"), "letters_first", match(ptf_p, "^[0-9]+[A-Z]+$"), "serial_first", true(), "other"), \
  letters=replace(ptf_p, "[0-9]", ""), \
  serial=replace(ptf_p, "[A-Z]", ""), \
  ptf_at=if(layout!="other" AND len(letters)==3, case(layout=="serial_first" AND match(letters, "D$"), "suffix", match(letters, "^[DCS]"), "prefix", match(letters, "D$"), "suffix"), null()), \
  role_letter=case(ptf_at=="prefix", substr(letters, 1, 1), ptf_at=="suffix", "D"), \
  code=case(layout=="other", null(), ptf_at=="prefix", substr(letters, 2), ptf_at=="suffix", substr(letters, 1, 2), true(), letters), \
  mission_role=coalesce(mission_role, case(ptf_at=="suffix", "UN Diplomat", role_letter=="D", "Diplomat", role_letter=="C", "Consul", role_letter=="S", "Staff")), \
  plate_shaped=if(len(code)==2 AND len(serial)<=4, "true", "false"), \
  ptf_p=null(), ptf_at=null()
iseval = 0
description = Adds code, letters, role_letter, mission_role, serial, layout and plate_shaped to events with a plate field, the way the site reads a plate it doesn't know.

[ptf_country_name]
definition = eval country=trim(replace(mvindex(split(country, "|"), 0), "\s*,\s*(UN Diplomat|Consul|Diplomat|Staff)$", ""))
iseval = 0
description = The name the site shows for a country as plates.csv writes it: no |alias, no stray role.

[ptf_needs_research]
definition = `ptf_events` (event_type="unknown_plate" OR ((event_type="lookup" OR event_type="sighting") country="UNKNOWN")) \
| `ptf_plate_parts` \
| where plate_shaped=="true"
iseval = 0
description = Events for plate-shaped codes the site couldn't name: codes missing from plates.csv (unknown_plate), and the lookups and sightings of codes plates.csv lists as UNKNOWN.

# Record findings for a code from the search bar. Quote every argument, and keep double quotes and
# commas out of them:
#   | `ptf_research_set("GK", "identified", "Country as plates.csv names it", "Where and how you found out")`
# Status is new, researching, identified, added or not_a_code; "-" leaves country or note empty.
[ptf_research_set(4)]
args = code, status, country, note
definition = `ptf_research_set($code$, $status$, $country$, $note$, "search bar")`
iseval = 0
description = Records findings for a code in the research queue. Quote every argument: | `ptf_research_set("GK", "identified", "Country as plates.csv names it", "how you know")`. Status: new, researching, identified, added or not_a_code.

[ptf_research_set(5)]
args = code, status, country, note, who
definition = makeresults \
| eval code=upper(replace($code$, "[^A-Za-z]", "")), status=lower(trim($status$)), country=trim($country$), note=trim($note$), updated_by=$who$ \
| eval country=if(country=="-", "", country), note=if(note=="-", "", note) \
| where len(code)==2 AND in(status, "new", "researching", "identified", "added", "not_a_code") \
| lookup ptf_research code OUTPUT first_seen \
| eval _key=code, updated_at=now() \
| table _key code status country note first_seen updated_at updated_by \
| outputlookup append=true key_field=_key override_if_empty=false ptf_research
iseval = 0
description = ptf_research_set with who recorded the findings (the Research a code dashboard passes your user name).
