# Search-time settings for the events the site's Pages Functions send through HEC
# (functions/_lib/splunk.js). Each event is one JSON object, timestamped by HEC's "time" key.

[platethatflag:event]
KV_MODE = json
# CIM: the hashed visitor IP stands in for src (the site never sends the IP), the site's hostname for dest
FIELDALIAS-ptf_src = src_ip_hash AS src
FIELDALIAS-ptf_dest = host AS dest
EVAL-vendor_product = "Flag That Plate"
