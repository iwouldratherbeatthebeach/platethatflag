# The research queue: one record per code (its _key is the code). Only what researchers decide
# lives here; counts, plates and sightings are always read from the events.
#   status: new, researching, identified (country known, not yet in plates.csv), added, not_a_code

[ptf_research]
field.code = string
field.status = string
field.country = string
field.note = string
field.first_seen = time
field.updated_at = time
field.updated_by = string
accelerated_fields.ptf_code = {"code": 1}
