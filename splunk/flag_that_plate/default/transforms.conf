[ptf_research]
external_type = kvstore
collection = ptf_research
fields_list = _key, code, status, country, note, first_seen, updated_at, updated_by

# The site's plates.csv, one row per code with its parts. A copy: `node splunk/build.mjs` in the
# repository regenerates it, and installing the new package replaces it (the research queue stays).
[ptf_plate_codes]
filename = ptf_plate_codes.csv

# Letters that are easy to misread on a plate or mistype next to each other, for "codes it could be".
[ptf_letter_confusions]
filename = ptf_letter_confusions.csv
