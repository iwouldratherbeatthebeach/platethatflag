# One event type per kind of event the site sends (event_type). No index here, so the CIM data
# models find them wherever the events live; the dashboards narrow by the ptf_index macro.

[ptf_lookup]
search = sourcetype="platethatflag:event" event_type="lookup"
description = A plate looked up on Flag That Plate (POST /track)

[ptf_unknown_plate]
search = sourcetype="platethatflag:event" event_type="unknown_plate"
description = A plate whose code isn't in plates.csv (POST /unknown)

[ptf_sighting]
search = sourcetype="platethatflag:event" event_type="sighting"
description = A vehicle sighting a visitor saved (POST /observe)

[ptf_authentication]
search = sourcetype="platethatflag:event" event_type="login"
description = A sign-in attempt, successful or not (POST /login)

[ptf_account]
search = sourcetype="platethatflag:event" (event_type="signup" OR event_type="logout")
description = An account created or a sign-out (POST /signup, POST /logout)

[ptf_error]
search = sourcetype="platethatflag:event" event_type="error"
description = A Function that answered 500
