# Alerts. Each one lists its results under Activity > Triggered Alerts; add an email or another
# action in Splunk Web (Alerts > Edit > Edit Alert) to be told directly.

[Flag That Plate - New codes to research]
description = Adds each plate-shaped code the site couldn't name (missing from plates.csv, or listed there as UNKNOWN) to the research queue the first time it is seen, and triggers once for those new codes. Runs every 30 minutes over the last 7 days; a code already in the queue is left as it is.
search = `ptf_needs_research` \
| stats min(_time) AS first_seen BY code \
| lookup ptf_research code OUTPUT status AS queued \
| where isnull(queued) \
| eval _key=code, status="new", country="", note="", updated_at=now(), updated_by="Flag That Plate" \
| table _key code status country note first_seen updated_at updated_by \
| outputlookup append=true key_field=_key override_if_empty=false ptf_research
enableSched = 1
cron_schedule = */30 * * * *
schedule_window = auto
dispatch.earliest_time = -7d@h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 2
alert.digest_mode = 1
alert.suppress = 0
request.ui_dispatch_app = flag_that_plate
request.ui_dispatch_view = search

[Flag That Plate - Repeated sign-in failures]
description = Triggers when one visitor (by hashed IP address) fails to sign in 10 or more times in 15 minutes.
search = `ptf_events` event_type="login" action="failure" \
| stats count AS failures dc(user) AS accounts values(user) AS user values(reason) AS reason values(src_country) AS src_country min(_time) AS first_attempt max(_time) AS last_attempt BY src_ip_hash \
| where failures >= 10 \
| convert ctime(first_attempt) ctime(last_attempt)
enableSched = 1
cron_schedule = */15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
request.ui_dispatch_app = flag_that_plate
request.ui_dispatch_view = search

[Flag That Plate - Server errors]
description = Triggers when a Function answered 500 in the last 15 minutes.
search = `ptf_events` event_type="error" \
| stats count AS errors values(uri_path) AS uri_path values(error) AS error latest(cf_ray) AS last_cf_ray \
| where errors > 0
enableSched = 1
cron_schedule = */15 * * * *
schedule_window = auto
dispatch.earliest_time = -15m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
request.ui_dispatch_app = flag_that_plate
request.ui_dispatch_view = search

[Flag That Plate - Events stopped arriving]
description = Triggers when the site has sent nothing for 24 hours: a revoked HEC token, a changed URL, or forwarding switched off. Off until events are flowing; enable it then.
disabled = 1
search = | tstats count WHERE `ptf_index` sourcetype="platethatflag:event" \
| where count == 0
enableSched = 1
cron_schedule = 17 * * * *
schedule_window = auto
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 12h
request.ui_dispatch_app = flag_that_plate
request.ui_dispatch_view = search
